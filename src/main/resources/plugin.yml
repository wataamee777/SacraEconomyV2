name: SacraEconomyV2
version: 1.2.0
main: si.f5.wata777.sacraeconomyv2.SacraEconomyV2
description: Advanced Economy Plugin for Sacra Servers
authors:
  - wataamee777
website: https://github.com/wataamee777/SacraEconomyV2
api-version: "1.21"

commands:
  sc:
    description: "Main SacraEconomy command"
    usage: /<command> [args]
    aliases:
      - sacra
      - economy

permissions:
  sacraeconomy.admin:
    description: "Admin access to SacraEconomy commands"
    default: op
  sacraeconomy.shop.create:
    description: "Permission to create shop signs"
    default: true
  sacraeconomy.trade:
    description: "Permission to use trade commands"
    default: true
  sacraeconomy.shop:
    description: "Permission to use shop commands"
    default: true
