# SacraEconomyV2 Configuration
# Paper 26.2+ Required

# Database Configuration
database:
  type: "mysql"  # MySQL required for v1.2.0+
  prefix: "sc_"  # Table name prefix
  mysql:
    host: "localhost"
    port: 3306
    database: "sacra_economy"
    username: "root"
    password: "password"
    ssl: false
    
# Language Settings
language:
  default: "ja"  # Default language: ja or en
  available-languages:
    - "ja"
    - "en"

# Economy Settings
economy:
  currency-name: "Yen"
  currency-symbol: "¥"
  starting-balance: 1000.0
  max-balance: 9999999999.0
  decimal-places: 2

# Jobs/Work Configuration
jobs:
  enabled: true
  cooldown-seconds: 300  # 5 minutes between work
  base-reward: 100.0
  rewards:
    # jobId: amount
    mining: 150.0
    farming: 120.0
    fishing: 140.0
    hunting: 130.0
    crafting: 110.0

# Shop Configuration
official-shop:
  enabled: true
  buy-multiplier: 0.8    # Players sell at 80% of shop price
  sell-multiplier: 1.2   # Players buy at 120% of shop price

# Trading Configuration
trading:
  chest-enabled: true
  chest-sign-prefix: "[sc:"
  timeout-seconds: 300  # Trade request timeout

# Achievement/Level System
achievements:
  enabled: true
  rewards-per-level:
    1: 500.0
    2: 750.0
    3: 1000.0
    4: 1500.0
    5: 2000.0

# Giveaway Codes
giveaways:
  enabled: true
  default-codes:
    "NEW2024": 5000.0
    "WELCOME": 2500.0

# Features
features:
  player-shops: true
  admin-shops: true
  chest-trading: true
  achievements: true
  job-system: true
